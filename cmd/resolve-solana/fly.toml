# fly.toml — Solana token-order resolver (scheduled job)
# Deploy: fly deploy --config cmd/resolve-solana/fly.toml
# Secrets: fly secrets set DATABASE_URL=... --config cmd/resolve-solana/fly.toml

app = "onchain-resolver"
primary_region = "ord"

[build]
  dockerfile = "cmd/resolve-solana/Dockerfile"

[env]
  RPC_ENDPOINT_SOLANA = "https://api.mainnet-beta.solana.com/"
  TOKEN_ORDER_CACHE   = "/app/cache/token_order_cache.json"
  # Runs every 15 minutes, picking up newly indexed pools.
  # Set to "once" if you want a one-shot Machine instead.
  RESOLVE_INTERVAL    = "15m"

# DATABASE_URL must be set as a fly secret:
#   fly secrets set DATABASE_URL="postgresql://..." --app onchain-resolver

[processes]
  app = "/app/resolver"

[[mounts]]
  # Mount the SAME volume as the watcher so both share token_order_cache.json.
  # Create it once: fly volumes create watcher_cache --region ord --size 1
  source      = "watcher_cache"
  destination = "/app/cache"
