# fly.toml — Solana on-chain price watcher
# Deploy: fly deploy --config cmd/watcher/fly.toml
# Secrets: fly secrets set DATABASE_URL=... RPC_ENDPOINT_SOLANA=... --config cmd/watcher/fly.toml

app = "onchain-watcher"
primary_region = "ord"          # Chicago — low latency to Solana validators

[build]
  dockerfile = "cmd/watcher/Dockerfile"
  # Build context is the repo root so all internal packages are visible

[env]
  # Non-secret defaults — override via `fly secrets set` for sensitive values
  RPC_ENDPOINT_SOLANA  = "https://api.mainnet-beta.solana.com/"
  RPC_ENDPOINT_BSC     = "https://bsc-dataseed.nariox.org/"
  RPC_ENDPOINT_BASE    = "https://mainnet.base.org/"
  TOKEN_ORDER_CACHE    = "/app/cache/token_order_cache.json"

# DATABASE_URL must be set as a fly secret:
#   fly secrets set DATABASE_URL="postgresql://..." --app onchain-watcher

[[services]]
  # No HTTP port — this is a pure background worker
  internal_port = 8080
  protocol      = "tcp"

  [[services.tcp_checks]]
    grace_period  = "30s"
    interval      = "15s"
    timeout       = "5s"
    restart_limit = 3

[processes]
  app = "/app/watcher"

[[mounts]]
  source      = "watcher_cache"
  destination = "/app/cache"

[metrics]
  port = 9091
  path = "/metrics"
