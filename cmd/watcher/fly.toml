# fly.toml — Solana on-chain price watcher
# Deploy from repo root:  fly deploy --config cmd/watcher/fly.toml
# Secrets:               fly secrets set DATABASE_URL="postgresql://..." --app onchain-watcher

app = "onchain-watcher"
primary_region = "ord"

[build]
  # Dockerfile is at the repo root; build context must be the repo root.
  # Run `fly deploy` from the repo root, NOT from cmd/watcher/.
  dockerfile = "Dockerfile"

  [build.args]
    BUILD_TARGET = "cmd/watcher"

[env]
  RPC_ENDPOINT_SOLANA  = "https://api.mainnet-beta.solana.com/"
  RPC_ENDPOINT_BSC     = "https://bsc-dataseed.nariox.org/"
  RPC_ENDPOINT_BASE    = "https://mainnet.base.org/"
  TOKEN_ORDER_CACHE    = "/app/cache/token_order_cache.json"

# DATABASE_URL must be set as a fly secret — never put it in this file.
# Run once:  fly secrets set DATABASE_URL="postgresql://..." --app onchain-watcher

[[services]]
  internal_port = 8080
  protocol      = "tcp"

  [[services.tcp_checks]]
    grace_period  = "30s"
    interval      = "15s"
    timeout       = "5s"
    restart_limit = 3

[processes]
  app = "/app/run-app"

[[mounts]]
  source      = "watcher_cache"
  destination = "/app/cache"
